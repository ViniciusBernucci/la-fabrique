# Proxy do painel: serve o front estático e encaminha /api para a API (rede
# privada). TLS é terminado no proxy do host (ver docs/operacao/ambientes-docker.md);
# este nginx escuta HTTP interno na 8080.
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  client_max_body_size 1m;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # IP real do cliente: só confia em X-Forwarded-For vindo de proxies privados
  # (proxy TLS do host / gateway do Docker). Cliente público não consegue forjar.
  set_real_ip_from 127.0.0.1;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    include /etc/nginx/security-headers.conf;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location /api/ {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://api:8480;
      proxy_http_version 1.1;
      # $http_host preserva a porta: a API compara Origin com o Host (anti-CSRF).
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      # SSE (logs em tempo real, E16): sem buffer e com leitura longa.
      proxy_hide_header X-Content-Type-Options;
      proxy_buffering off;
      proxy_read_timeout 1h;
    }

    # Arquivos com hash no nome: cache longo.
    location /assets/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # SPA: qualquer outra rota cai no index.html.
    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache";
      try_files $uri /index.html;
    }
  }
}
