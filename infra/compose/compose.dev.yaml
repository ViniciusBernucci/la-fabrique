# Overlay de desenvolvimento: hot reload e portas em loopback. Use `make up`.
services:
  postgres:
    # Portas só são publicadas para containers em rede não-internal; por isso o
    # Postgres entra na rede edge apenas em dev (na VPS ele não é publicado).
    networks: [private, edge]
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5442}:5432"

  api:
    build:
      target: dev
      args: {CMD: api}
    image: le-fabrique/api:dev
    read_only: false
    command: ["air", "-c", "/src/infra/images/air.api.toml"]
    working_dir: /src
    volumes:
      - .:/src
      - ${WORKSPACES_HOST_DIR:-./workspaces}:/workspaces
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    user: "0:0"
    cap_drop: []
    security_opt: []
    ports:
      - "127.0.0.1:${API_PORT:-8480}:8480"

  worker:
    build:
      target: dev
      args: {CMD: worker}
    image: le-fabrique/worker:dev
    read_only: false
    command: ["air", "-c", "/src/infra/images/air.worker.toml"]
    working_dir: /src
    environment:
      # Login das contas de IA pelo painel (ADR-0065): liga o runner e deixa o worker construir a imagem
      # dos clientes (infra/images/Dockerfile.cli) se ela ainda não existir.
      CLI_LOGIN: "true"
      # Fábrica: o worker conduz os workflows publicados (ADR-0069). FACTORY_PUSH liga enviar a branch e abrir a Draft PR.
      FACTORY_RUN: "true"
      # Sentinela (opt-in; escrevem no Jira/GitHub reais): SENTINEL_ISSUE_SYNC importa as Issues e PROJETA o status das
      # execuções no Jira (precisa de permissão de escrita na conexão); SENTINEL_PR_SYNC acompanha as PRs abertas
      # (rodadas de revisão viram Issues de correção; o merge conclui). Ligue no .env quando quiser o ciclo completo.
      SENTINEL_ISSUE_SYNC: ${SENTINEL_ISSUE_SYNC:-false}
      SENTINEL_PR_SYNC: ${SENTINEL_PR_SYNC:-false}
      FACTORY_PUSH: ${FACTORY_PUSH:-false}
      FACTORY_IMAGE: le-fabrique/cli:dev
      # Checks e scripts com a toolchain deste repositório (make tools-image). Rede dos checks: none (padrão) ou egress.
      FACTORY_TOOL_IMAGE: ${FACTORY_TOOL_IMAGE:-le-fabrique/tools:dev}
      FACTORY_CHECKS_NETWORK: ${FACTORY_CHECKS_NETWORK:-none}
      # Filtro de saída do terminal do agente (make egress-image): rede interna + proxy com lista de destinos.
      FACTORY_EGRESS_FILTER: ${FACTORY_EGRESS_FILTER:-true}
      FACTORY_EGRESS_IMAGE: ${FACTORY_EGRESS_IMAGE:-le-fabrique/egress:dev}
      CLI_LOGIN_CONTEXT: /src/infra/images
    volumes:
      - .:/src
      - ${WORKSPACES_HOST_DIR:-./workspaces}:/workspaces
      # ATENÇÃO: o docker.sock equivale a acesso root à máquina. Só em desenvolvimento; o worker o usa
      # apenas para o login das contas e para o sandbox (ADR-0065).
      - /var/run/docker.sock:/var/run/docker.sock
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    user: "0:0"
    cap_drop: []
    security_opt: []

  web:
    build:
      context: .
      dockerfile: infra/images/Dockerfile.web
      target: dev
    image: le-fabrique/web:dev
    read_only: false
    tmpfs: []
    user: "0:0"
    cap_drop: []
    cap_add: []
    security_opt: []
    working_dir: /app
    # O servidor do Vite pré-empacota as dependências (React Flow etc.) e estoura os 128 MB do nginx de produção.
    mem_limit: ${LIMIT_WEB_DEV_MEM:-768m}
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"]
    environment:
      API_PROXY_TARGET: http://api:8480
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:${WEB_PORT:-5180}:5173"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s

volumes:
  go_mod_cache:
  go_build_cache:
  web_node_modules:
