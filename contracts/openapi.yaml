      properties:
        id: {type: string, pattern: "^[A-Za-z0-9_-]{1,64}$"}
        type: {type: string}
        x: {type: number}
        y: {type: number}
        props: {type: object, additionalProperties: true}
    WorkflowEdge:
      type: object
      required: [id, from, from_port, to, to_port]
      properties:
        id: {type: string}
