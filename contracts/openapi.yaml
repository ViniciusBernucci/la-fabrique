        from_port: {type: string}
        to: {type: string}
        to_port: {type: string}
    WorkflowGraph:
      type: object
      required: [nodes, edges]
      properties:
        nodes: {type: array, maxItems: 200, items: {$ref: "#/components/schemas/WorkflowNode"}}
        edges: {type: array, maxItems: 400, items: {$ref: "#/components/schemas/WorkflowEdge"}}
    WorkflowIssue:
      type: object
      required: [node, field, code, message]
      properties:
        node: {type: string, description: "Vazio = problema do grafo inteiro"}
