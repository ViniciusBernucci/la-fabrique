        required: {type: boolean}
        options: {type: array, items: {type: string}}
        min: {type: integer}
        max: {type: integer}
        hint: {type: string}
    NodeType:
      type: object
      required: [type, label, category, inputs, outputs, multi_in, fields]
      properties:
        type: {type: string}
        label: {type: string}
        category: {type: string, enum: [fluxo, execução, controle]}
        inputs: {type: [array, "null"], items: {type: string}}
        outputs: {type: array, items: {type: string}}
        multi_in: {type: boolean}
        fields: {type: [array, "null"], items: {$ref: "#/components/schemas/FieldSpec"}}
    WorkflowNode:
      type: object
