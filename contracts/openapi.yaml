        key: {type: string}
        value: {type: string}
        expression: {type: string}
    SkillManifest:
      type: object
      required: [name, description, executor, permissions, resources, commands, steps]
      properties:
        name: {type: string}
        description: {type: string}
        executor: {type: string, enum: [ai, script, deterministic, hybrid]}
        permissions: {type: array, items: {type: string}}
        resources: {type: array, items: {type: string}}
        commands: {type: array, items: {type: string}}
        steps: {type: array, items: {$ref: "#/components/schemas/SkillStep"}}
    SkillInput:
      type: object
      required: [name, executor]
      additionalProperties: false
      properties:
        name: {type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"}
        description: {type: string, maxLength: 500}
        executor: {type: string, enum: [ai, script, deterministic, hybrid]}
        instructions: {type: string, maxLength: 60000}
        permissions: {type: array, items: {type: string}}
        resources: {type: array, items: {type: string}}
        commands: {type: array, maxItems: 30, items: {type: string}}
        steps: {type: array, maxItems: 30, items: {$ref: "#/components/schemas/SkillStep"}}
    SkillFile:
      type: object
      required: [path, sha256, size]
      properties:
        path: {type: string}
        sha256: {type: string}
        size: {type: integer}
    Skill:
      type: object
      required: [id, name, description, executor, source_kind, source_ref, revision, content_hash, body, manifest, needs_approval, version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        description: {type: string}
        executor: {type: string, enum: [ai, script, deterministic, hybrid]}
        source_kind: {type: string, enum: [manual, file, package, git]}
        source_ref: {type: string}
        revision: {type: string}
        content_hash: {type: string, description: "SHA-256 do conteúdo (arquivos, manifesto e instruções)"}
        body: {type: string}
        manifest: {$ref: "#/components/schemas/SkillManifest"}
        needs_approval: {type: boolean, description: "Algum comando é sensível e exigirá aprovação ao rodar"}
        version: {type: integer}
        files: {type: array, items: {$ref: "#/components/schemas/SkillFile"}}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    SkillImport:
      type: object
      required: [id, name, source_kind, source_ref, outcome, reason, content_hash, created_at]
      properties:
        id: {type: integer}
        name: {type: string}
        source_kind: {type: string}
        source_ref: {type: string}
        outcome: {type: string, enum: [imported, unchanged, replaced, rejected]}
        reason: {type: string}
        content_hash: {type: string}
        created_at: {type: string, format: date-time}
