openapi: 3.0.3
info:
  title: Le Fabrique — API interna
  version: 0.1.0
  description: |
    Contrato interno entre o painel web e a API Go. Cresce a cada épico; esta
    versão cobre T03 (saúde, sessão, projetos) e E04 (login com senha + TOTP,
    recuperação, sessões, reautenticação, CSRF e cofre de conexões).

    **Autenticação.** Toda rota fora de /healthz, /readyz e /auth/login|totp|
    recover|totp/setup|totp/enable exige o cookie de sessão `lf_session`
    (HttpOnly, SameSite=Strict, Secure em produção). A sessão só nasce depois
    de senha + segundo fator.

    **CSRF.** Em POST/PUT/PATCH/DELETE autenticados envie `X-CSRF-Token` com o
    `csrf_token` devolvido por `GET /session` ou pelo login. A API também recusa
    `Origin`/`Sec-Fetch-Site` de outra origem (403 `csrf_rejected`).

    **Ações sensíveis** (marcadas abaixo) exigem reautenticação recente
    (`reauth_until` na sessão); sem ela: 403 `reauth_required`. Reautentique com
    `POST /auth/reauth` e repita a ação.

    **HTTPS.** Em produção a API recusa requisições que o proxy não marcou como
    HTTPS (400 `https_required`) e envia HSTS.

    Erros seguem `ErrorBody`. Nenhuma resposta contém segredos; o valor de uma
    conexão nunca volta pela API.
servers:
  - url: /api
tags:
  - name: operacao
  - name: sessao
  - name: autenticacao
  - name: conexoes
  - name: projetos
paths:
  /healthz:
    get:
      tags: [operacao]
      summary: Liveness do processo
      security: []
      responses:
        "200": {description: Processo vivo, content: {application/json: {schema: {$ref: "#/components/schemas/Status"}}}}
  /readyz:
    get:
      tags: [operacao]
      summary: Readiness (inclui o PostgreSQL)
      security: []
      responses:
        "200": {description: Pronto, content: {application/json: {schema: {$ref: "#/components/schemas/Status"}}}}
        "503": {$ref: "#/components/responses/Error"}
  /session:
    get:
      tags: [sessao]
      summary: Sessão administrativa atual
      responses:
        "200": {description: Sessão válida, content: {application/json: {schema: {$ref: "#/components/schemas/Session"}}}}
        "401": {$ref: "#/components/responses/Error"}
  /auth/login:
    post:
      tags: [autenticacao]
      summary: Passo 1 do login — valida usuário e senha
      description: |
        NÃO abre sessão. Em caso de sucesso define o cookie de desafio
        `lf_challenge` (10 min, HttpOnly) e informa o próximo passo. Após 5
        falhas na conta (ou 20 no IP) em 15 min: 429 `too_many_attempts`.
        Usuário inexistente e senha errada têm a mesma resposta.
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/LoginRequest"}}}}
      responses:
        "200": {description: Senha correta; falta o segundo fator, content: {application/json: {schema: {$ref: "#/components/schemas/LoginStage"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /auth/totp:
    post:
      tags: [autenticacao]
      summary: Passo 2 do login — código TOTP
      description: Exige o cookie `lf_challenge`. Cada código só vale uma vez (anti-replay). Abre a sessão.
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CodeRequest"}}}}
      responses:
        "200": {description: Sessão aberta e cookie definido, content: {application/json: {schema: {$ref: "#/components/schemas/Session"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /auth/recover:
    post:
      tags: [autenticacao]
      summary: Passo 2 alternativo — código de recuperação (uso único)
      description: |
        Exige `lf_challenge`. O código é consumido atomicamente: requisições
        concorrentes com o mesmo código resultam em uma única sessão. A sessão
        volta com `totp_reset_required=true` (substitua o 2FA).
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/RecoveryRequest"}}}}
      responses:
        "200": {description: Sessão aberta e cookie definido, content: {application/json: {schema: {$ref: "#/components/schemas/Session"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /auth/totp/setup:
    post:
      tags: [autenticacao]
      summary: Primeiro acesso — gera o segredo TOTP
      description: Exige `lf_challenge` de uma conta ainda sem 2FA. O segredo é guardado cifrado.
      security: []
      responses:
        "200": {description: Material para o app autenticador, content: {application/json: {schema: {$ref: "#/components/schemas/Enrollment"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /auth/totp/enable:
    post:
      tags: [autenticacao]
      summary: Primeiro acesso — confirma o TOTP, emite códigos de recuperação e abre a sessão
      description: Os códigos de recuperação são mostrados **uma única vez**.
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CodeRequest"}}}}
      responses:
        "201": {description: 2FA ativo e sessão aberta, content: {application/json: {schema: {$ref: "#/components/schemas/SessionWithRecoveryCodes"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /auth/logout:
    post:
      tags: [autenticacao]
      summary: Encerra e revoga a sessão atual
      responses:
        "200": {description: Sessão revogada, content: {application/json: {schema: {$ref: "#/components/schemas/Status"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /auth/reauth:
    post:
      tags: [autenticacao]
      summary: Reautentica (senha + código TOTP) e abre a janela de ações sensíveis
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ReauthRequest"}}}}
      responses:
        "200": {description: Janela aberta (`reauth_until`), content: {application/json: {schema: {$ref: "#/components/schemas/Session"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /auth/events:
    get:
      tags: [autenticacao]
      summary: Trilha de autenticação (últimos 50 eventos)
      description: Nunca contém senha, código, token nem nome de usuário tentado.
      responses:
        "200": {description: Eventos, mais novos primeiro, content: {application/json: {schema: {$ref: "#/components/schemas/AuthEventList"}}}}
        "401": {$ref: "#/components/responses/Error"}
  /auth/totp/replace/begin:
    post:
      tags: [autenticacao]
      summary: "[SENSÍVEL] Inicia a substituição do segundo fator"
      description: Gera um segredo pendente; o atual segue valendo até a confirmação.
      responses:
        "200": {description: Material para o novo autenticador, content: {application/json: {schema: {$ref: "#/components/schemas/Enrollment"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /auth/totp/replace/confirm:
    post:
      tags: [autenticacao]
      summary: "[SENSÍVEL] Confirma a substituição do segundo fator"
      description: Emite novos códigos de recuperação (invalida os anteriores) e revoga as demais sessões.
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CodeRequest"}}}}
      responses:
        "200": {description: Segundo fator substituído, content: {application/json: {schema: {$ref: "#/components/schemas/RecoveryCodes"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /sessions:
    get:
      tags: [sessao]
      summary: Sessões ativas do administrador
      responses:
        "200": {description: Sessões, content: {application/json: {schema: {$ref: "#/components/schemas/SessionList"}}}}
        "401": {$ref: "#/components/responses/Error"}
  /sessions/{id}:
    delete:
      tags: [sessao]
      summary: Revoga uma sessão (a própria é livre; outra é SENSÍVEL)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Sessão revogada, content: {application/json: {schema: {$ref: "#/components/schemas/Status"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /sessions/revoke-others:
    post:
      tags: [sessao]
      summary: "[SENSÍVEL] Revoga todas as sessões exceto a atual"
      responses:
        "200": {description: Quantidade revogada, content: {application/json: {schema: {$ref: "#/components/schemas/RevokedCount"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /connections:
    get:
      tags: [conexoes]
      summary: Lista conexões do cofre (sem segredos)
      responses:
        "200": {description: Conexões, content: {application/json: {schema: {$ref: "#/components/schemas/ConnectionList"}}}}
        "401": {$ref: "#/components/responses/Error"}
    post:
      tags: [conexoes]
      summary: "[SENSÍVEL] Cria uma conexão (o segredo é cifrado com chave externa ao banco)"
      description: |
        `secret` é aceito aqui e **nunca** devolvido. Jira: `email:token` com
        `target` https://<site>.atlassian.net. Use escopos mínimos no destino.
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/NewConnection"}}}}
      responses:
        "201": {description: Conexão criada, content: {application/json: {schema: {$ref: "#/components/schemas/Connection"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /connections/{id}:
    get:
      tags: [conexoes]
      summary: Detalhe de uma conexão (sem segredo)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Conexão, content: {application/json: {schema: {$ref: "#/components/schemas/Connection"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /connections/{id}/test:
    post:
      tags: [conexoes]
      summary: Testa a credencial no destino e grava o resultado
      description: |
        GitHub, ClickUp e Jira têm teste remoto. cli/api/mcp devolvem
        `not_run` (sem teste remoto seguro): o segredo só é decifrado.
        O detalhe nunca contém corpo remoto nem o segredo.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Resultado em `last_test_*`, content: {application/json: {schema: {$ref: "#/components/schemas/Connection"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /connections/{id}/rotate:
    post:
      tags: [conexoes]
      summary: "[SENSÍVEL] Troca o segredo mantendo id e vínculos"
      description: O valor anterior é descartado. `expected_version` evita sobrescrever alteração concorrente (409 `version_conflict`).
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/RotateConnection"}}}}
      responses:
        "200": {description: Conexão rotacionada, content: {application/json: {schema: {$ref: "#/components/schemas/Connection"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /connections/{id}/revoke:
    post:
      tags: [conexoes]
      summary: "[SENSÍVEL] Revoga a conexão e apaga o segredo (irreversível, idempotente)"
      description: O efeito vale para o próximo uso, sem cache (`Vault.Resolve` consulta o banco).
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Conexão revogada, content: {application/json: {schema: {$ref: "#/components/schemas/Connection"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /projects:
    post:
      tags: [projetos]
      summary: Cria um projeto em rascunho, vazio de vínculos (agentes, workflows, recursos)
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/NewProject"}}}
      responses:
        "201": {description: Projeto em rascunho, content: {application/json: {schema: {$ref: "#/components/schemas/Project"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
    get:
      tags: [projetos]
      summary: Lista projetos (mais novos primeiro), paginada por cursor
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: cursor, in: query, schema: {type: string}, description: "Valor de next_cursor da página anterior"}
        - {name: state, in: query, schema: {$ref: "#/components/schemas/ProjectState"}}
      responses:
        "200": {description: Página de projetos, content: {application/json: {schema: {$ref: "#/components/schemas/ProjectPage"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
  /projects/{id}:
    get:
      tags: [projetos]
      summary: Detalhe de um projeto
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Projeto, content: {application/json: {schema: {$ref: "#/components/schemas/Project"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    patch:
      tags: [projetos]
      summary: Persiste uma etapa do assistente ou ajusta dados do projeto
      description: >
        Controle otimista por `expected_version` (409 `version_conflict`). `repository` e `source`
        substituem o grupo inteiro; campos vazios são aceitos no rascunho e viram pendências.
        Alterar `repository` ou `source` de projeto ativo devolve 409 `project_active`.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ProjectPatch"}}}
      responses:
        "200": {description: Projeto atualizado, content: {application/json: {schema: {$ref: "#/components/schemas/Project"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /projects/{id}/validation:
    get:
      tags: [projetos]
      summary: Relatório de validação do preenchimento (pendências com ação concreta)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Relatório, content: {application/json: {schema: {$ref: "#/components/schemas/ValidationReport"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /projects/{id}/changes:
    get:
      tags: [projetos]
      summary: Trilha de criação, alterações, mudança de origem, ativação e suspensão
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Alterações, da mais recente para a mais antiga
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties: {items: {type: array, items: {$ref: "#/components/schemas/ProjectChange"}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /projects/{id}/source/check:
    post:
      tags: [projetos]
      summary: Verifica a origem (Jira/ClickUp) com a conexão do cofre e devolve o preview dos itens elegíveis
      description: >
        Prova credencial, projeto/lista, estados elegíveis e prioridades do mapa e lista até 20 itens
        elegíveis. Nada é escrito na origem. Falhas remotas voltam como passos `failed` com motivo
        (HTTP 200); o resultado fica gravado para a configuração atual e a ativação o exige.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Resultado da verificação, content: {application/json: {schema: {$ref: "#/components/schemas/SourceCheck"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /projects/{id}/activate:
    post:
      tags: [projetos]
      summary: Ativa um rascunho; bloqueado (422) enquanto houver pendências obrigatórias
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ExpectedVersion"}}}
      responses:
        "200": {description: Projeto ativo, content: {application/json: {schema: {$ref: "#/components/schemas/Project"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /projects/{id}/suspend:
    post:
      tags: [projetos]
      summary: Suspende um projeto ativo
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ExpectedVersion"}}}
      responses:
        "200": {description: Projeto suspenso, content: {application/json: {schema: {$ref: "#/components/schemas/Project"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /projects/{id}/resume:
    post:
      tags: [projetos]
      summary: Reativa um projeto suspenso, revalidando a configuração
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ExpectedVersion"}}}
      responses:
        "200": {description: Projeto ativo, content: {application/json: {schema: {$ref: "#/components/schemas/Project"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /workflows/node-types:
    get:
      tags: [workflows]
      summary: Catálogo de tipos de nó (portas e campos); fonte única do editor e do validador
      responses:
        "200":
          description: Tipos de nó
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties: {items: {type: array, items: {$ref: "#/components/schemas/NodeType"}}}
        "401": {$ref: "#/components/responses/Error"}
  /workflows/{id}/publish:
    post:
      tags: [workflows]
      summary: Publica a versão salva do rascunho (imutável); idempotente para o mesmo conteúdo (200)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [expected_version], additionalProperties: false, properties: {expected_version: {type: integer}}}}}
      responses:
        "200": {description: Conteúdo igual ao vigente, content: {application/json: {schema: {$ref: "#/components/schemas/WorkflowVersion"}}}}
        "201": {description: Nova versão publicada, content: {application/json: {schema: {$ref: "#/components/schemas/WorkflowVersion"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {description: Problemas impedem a publicação (envelope de erro mais a lista `problems`)}
  /workflows/{id}/unpublish:
    post:
      tags: [workflows]
      summary: Tira a versão vigente de circulação (execuções existentes não mudam)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204": {description: Despublicado}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /workflows/{id}/versions:
    get:
      tags: [workflows]
      summary: Versões publicadas do workflow (sem os grafos)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Versões
          content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: "#/components/schemas/WorkflowVersion"}}}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /workflow-versions/{id}:
    get:
      tags: [workflows]
      summary: Versão publicada com a configuração efetiva congelada (sanitizada)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Versão, content: {application/json: {schema: {$ref: "#/components/schemas/WorkflowVersion"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /workflow-versions/{id}/revalidate:
    get:
      tags: [workflows]
      summary: Revalida em tempo de execução (conta revogada, modelo desativado, itens removidos)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Resultado
          content: {application/json: {schema: {type: object, required: [ok, problems], properties: {ok: {type: boolean}, problems: {type: array, items: {$ref: "#/components/schemas/PublishProblem"}}}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /budgets:
    get:
      tags: [orcamento]
      summary: Orçamentos de gasto em API com o uso do período corrente (gasto, reservas ativas e saldo)
      responses:
        "200":
          description: Orçamentos
          content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: "#/components/schemas/BudgetStatus"}}}}}}
        "401": {$ref: "#/components/responses/Error"}
    post:
      tags: [orcamento]
      summary: Cria ou altera (upsert) o orçamento global ou de um agente (reautenticação exigida)
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [scope, period, limit_micros], additionalProperties: false, properties: {scope: {type: string, enum: [global, agent]}, agent_id: {type: string, format: uuid}, period: {type: string, enum: [day, month]}, limit_micros: {type: integer, minimum: 0}, state: {type: string, enum: [active, disabled]}}}}}
      responses:
        "200": {description: Orçamento, content: {application/json: {schema: {$ref: "#/components/schemas/Budget"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /usage:
    get:
      tags: [orcamento]
      summary: Uso do período (padrão mês corrente UTC) com gasto em API e consumo de assinatura em seções separadas
      parameters:
        - {name: from, in: query, required: false, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: false, schema: {type: string, format: date-time}}
      responses:
        "200": {description: Relatório, content: {application/json: {schema: {$ref: "#/components/schemas/UsageReport"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
  /models:
    get:
      tags: [models]
      summary: Modelos cadastrados manualmente
      responses:
        "200":
          description: Modelos
          content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: "#/components/schemas/Model"}}}}}}
        "401": {$ref: "#/components/responses/Error"}
    post:
      tags: [models]
      summary: Cadastra um modelo (parâmetros e capacidades validados; gateway só no provedor api)
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ModelInput"}}}
      responses:
        "201": {description: Modelo cadastrado, content: {application/json: {schema: {$ref: "#/components/schemas/Model"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /models/check:
    post:
      tags: [models]
      summary: Diz, sem executar nada, se o modelo serve para provedor, conta e ferramentas
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [provider, model], additionalProperties: false, properties: {provider: {type: string}, connection_id: {type: string}, model: {type: string}, needs_tools: {type: boolean}}}}}
      responses:
        "200": {description: Veredito com os motivos, content: {application/json: {schema: {$ref: "#/components/schemas/ModelVerdict"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /models/{id}/state:
    post:
      tags: [models]
      summary: Ativa ou desativa o modelo (controle otimista)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [state, expected_version], additionalProperties: false, properties: {state: {type: string, enum: [active, disabled]}, expected_version: {type: integer}}}}}
      responses:
        "200": {description: Modelo atualizado, content: {application/json: {schema: {$ref: "#/components/schemas/Model"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /mcp/servers:
    get:
      tags: [mcp]
      summary: Servidores MCP cadastrados
      responses:
        "200":
          description: Servidores
          content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: "#/components/schemas/McpServer"}}}}}}
        "401": {$ref: "#/components/responses/Error"}
    post:
      tags: [mcp]
      summary: Cadastra um servidor MCP remoto (https, externo); a credencial é a referência de uma conexão `mcp`
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [name, url], additionalProperties: false, properties: {name: {type: string}, url: {type: string}, connection_id: {type: [string, "null"], format: uuid}}}}}
      responses:
        "201": {description: Servidor cadastrado, content: {application/json: {schema: {$ref: "#/components/schemas/McpServer"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /mcp/servers/{id}/discover:
    post:
      tags: [mcp]
      summary: Negocia o protocolo e descobre as ferramentas; nenhuma ganha acesso por ser descoberta
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Ferramentas do servidor
          content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: "#/components/schemas/McpTool"}}}}}}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
  /mcp/servers/{id}/tools:
    get:
      tags: [mcp]
      summary: Ferramentas já descobertas do servidor
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Ferramentas
          content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: "#/components/schemas/McpTool"}}}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /mcp/calls:
    get:
      tags: [mcp]
      summary: Trilha das chamadas MCP (argumentos redigidos)
      responses:
        "200":
          description: Chamadas, da mais recente para a mais antiga
          content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {type: object, additionalProperties: true}}}}}}
        "401": {$ref: "#/components/responses/Error"}
  /agents/{id}/mcp:
    get:
      tags: [mcp]
      summary: Concessões MCP do agente e as ferramentas que ele pode usar agora (concedidas e com o esquema aprovado ainda vigente)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Concessões e ferramentas utilizáveis
          content: {application/json: {schema: {type: object, required: [grants, tools], properties: {grants: {type: array, items: {$ref: "#/components/schemas/McpGrant"}}, tools: {type: array, items: {$ref: "#/components/schemas/McpTool"}}}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /agents/{id}/mcp-grants:
    post:
      tags: [mcp]
      summary: Concede uma ferramenta MCP ao agente, fixando o hash do esquema aprovado
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/McpGrantInput"}}}
      responses:
        "204": {description: Concedida}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /agents/{id}/mcp-grants/revoke:
    post:
      tags: [mcp]
      summary: Retira a concessão (idempotente)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/McpGrantInput"}}}
      responses:
        "204": {description: Revogada}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /decisions:
    get:
      tags: [decisões]
      summary: Central de decisões humanas
      parameters:
        - {name: state, in: query, schema: {type: string, enum: [pending, resolved, stale]}, description: "Vazio = todos"}
      responses:
        "200":
          description: Pedidos, do mais recente para o mais antigo
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties: {items: {type: array, items: {$ref: "#/components/schemas/DecisionRequest"}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
  /decisions/{id}:
    get:
      tags: [decisões]
      summary: Lê um pedido (problema, alternativas, impacto e evidência)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Pedido, content: {application/json: {schema: {$ref: "#/components/schemas/DecisionRequest"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /decisions/{id}/resolve:
    post:
      tags: [decisões]
      summary: Registra a decisão; altera só a execução do pedido e emite o sinal de retomada
      description: >
        Repetir a mesma opção é idempotente (cabeçalho `X-Decision-Replayed: true`, sem novo sinal). Outra opção
        depois de resolvido → 409 `decision_conflict`. Execução que mudou desde o pedido → 409 `decision_stale`
        (o pedido vira `stale`). Pedido de operação sensível exige reautenticação (403 `reauth_required`).
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [option]
              additionalProperties: false
              properties:
                option: {type: string}
                note: {type: string, maxLength: 500}
      responses:
        "200": {description: Pedido resolvido, content: {application/json: {schema: {$ref: "#/components/schemas/DecisionRequest"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /tools:
    get:
      tags: [ferramentas]
      summary: Catálogo de ferramentas (nativas e personalizadas) com esquemas, permissões e limites
      responses:
        "200":
          description: Ferramentas
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties: {items: {type: array, items: {$ref: "#/components/schemas/Tool"}}}
        "401": {$ref: "#/components/responses/Error"}
    post:
      tags: [ferramentas]
      summary: Cadastra uma ferramenta personalizada (script ou integração); o comando passa pela política
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/Tool"}}}
      responses:
        "201": {description: Ferramenta criada, content: {application/json: {schema: {$ref: "#/components/schemas/Tool"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /tools/{name}/check:
    post:
      tags: [ferramentas]
      summary: Valida uma chamada sem executá-la (existência, concessão, escopo e argumentos)
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant]
              additionalProperties: false
              properties:
                args: {type: object, additionalProperties: true}
                grant:
                  type: object
                  properties:
                    tools: {type: array, items: {type: string}}
                    permissions: {type: array, items: {type: string, enum: [read, write, exec, git, api]}}
      responses:
        "200":
          description: Chamada válida; devolve os argumentos normalizados
          content:
            application/json:
              schema:
                type: object
                required: [ok, args]
                properties: {ok: {type: boolean}, args: {type: object, additionalProperties: true}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /skills:
    get:
      tags: [skills]
      summary: Lista o catálogo de skills
      responses:
        "200":
          description: Skills
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties: {items: {type: array, items: {$ref: "#/components/schemas/Skill"}}}
        "401": {$ref: "#/components/responses/Error"}
    post:
      tags: [skills]
      summary: Cadastra uma skill manualmente (ia, script, deterministic ou hybrid)
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/SkillInput"}}}
      responses:
        "201": {description: Skill criada, content: {application/json: {schema: {$ref: "#/components/schemas/Skill"}}}}
        "200": {description: Já existia com o mesmo conteúdo (idempotente), content: {application/json: {schema: {$ref: "#/components/schemas/Skill"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /skills/imports:
    get:
      tags: [skills]
      summary: Trilha de importações (inclusive as rejeitadas, sem o conteúdo do pacote)
      responses:
        "200":
          description: Importações, da mais recente para a mais antiga
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties: {items: {type: array, items: {$ref: "#/components/schemas/SkillImport"}}}
        "401": {$ref: "#/components/responses/Error"}
  /skills/import:
    post:
      tags: [skills]
      summary: Importa um pacote (tar.gz ou zip) ou um SKILL.md avulso; o conteúdo é tratado como dado e nada é executado
      description: >
        Recusa travessia de caminho, links, arquivos acima dos limites (200 arquivos, 1 MiB cada, 5 MiB no total, 8 MiB compactado)
        e scripts fora da política. Mesmo nome com o mesmo conteúdo é idempotente; conteúdo diferente exige `replace=true`.
      parameters:
        - {name: format, in: query, required: true, schema: {type: string, enum: [tar.gz, zip, md]}}
        - {name: replace, in: query, schema: {type: boolean}}
        - {name: ref, in: query, schema: {type: string, maxLength: 300}, description: "Rótulo da origem (ex.: nome do arquivo)"}
      requestBody:
        required: true
        content: {application/octet-stream: {schema: {type: string, format: binary}}}
      responses:
        "201": {description: Skill importada, content: {application/json: {schema: {$ref: "#/components/schemas/Skill"}}}}
        "200": {description: Já existia com o mesmo conteúdo, content: {application/json: {schema: {$ref: "#/components/schemas/Skill"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /skills/import-git:
    post:
      tags: [skills]
      summary: Importação por Git (UNSUPPORTED até o adaptador GitHub, T15-01)
      responses:
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "501": {$ref: "#/components/responses/Error"}
  /skills/{id}:
    get:
      tags: [skills]
      summary: Lê uma skill com a lista de arquivos (caminho, hash e tamanho)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Skill, content: {application/json: {schema: {$ref: "#/components/schemas/Skill"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /agents:
    get:
      tags: [agentes]
      summary: Lista o catálogo global de agentes
      responses:
        "200":
          description: Agentes
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties: {items: {type: array, items: {$ref: "#/components/schemas/Agent"}}}
        "401": {$ref: "#/components/responses/Error"}
    post:
      tags: [agentes]
      summary: Cadastra um agente (conta por referência de conexão, nunca o segredo)
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/AgentInput"}}}
      responses:
        "201": {description: Agente criado, content: {application/json: {schema: {$ref: "#/components/schemas/Agent"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /agents/{id}:
    get:
      tags: [agentes]
      summary: Lê um agente
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Agente, content: {application/json: {schema: {$ref: "#/components/schemas/Agent"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    put:
      tags: [agentes]
      summary: Altera o agente com controle otimista de versão
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/AgentUpdate"}}}
      responses:
        "200": {description: Agente atualizado, content: {application/json: {schema: {$ref: "#/components/schemas/Agent"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /workflows/{id}/nodes/{node}/effective:
    get:
      tags: [agentes]
      summary: Configuração efetiva de um nó de agente (base do catálogo + sobrescritas do nó), sem segredos
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: node, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Configuração efetiva, content: {application/json: {schema: {$ref: "#/components/schemas/EffectiveAgent"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /workflows/validate:
    post:
      tags: [workflows]
      summary: Valida um grafo sem salvar (problemas com nó e campo)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [graph]
              additionalProperties: false
              properties: {graph: {$ref: "#/components/schemas/WorkflowGraph"}}
      responses:
        "200":
          description: Problemas encontrados (lista vazia = válido)
          content:
            application/json:
              schema:
                type: object
                required: [issues]
                properties: {issues: {type: array, items: {$ref: "#/components/schemas/WorkflowIssue"}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /workflows:
    get:
      tags: [workflows]
      summary: Lista rascunhos de workflow com contagem de nós e problemas
      responses:
        "200":
          description: Workflows
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties: {items: {type: array, items: {$ref: "#/components/schemas/WorkflowSummary"}}}
        "401": {$ref: "#/components/responses/Error"}
    post:
      tags: [workflows]
      summary: Cria um rascunho com o grafo inicial (início ligado a fim)
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/NewWorkflow"}}}
      responses:
        "201": {description: Rascunho criado, content: {application/json: {schema: {$ref: "#/components/schemas/Workflow"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /workflows/{id}:
    get:
      tags: [workflows]
      summary: Lê o rascunho com os problemas de validação (nó e campo)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Workflow, content: {application/json: {schema: {$ref: "#/components/schemas/Workflow"}}}}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    put:
      tags: [workflows]
      summary: Salva o rascunho (controle otimista); grafo inválido é aceito e devolve `issues`
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/SaveWorkflow"}}}
      responses:
        "200": {description: Rascunho salvo, content: {application/json: {schema: {$ref: "#/components/schemas/Workflow"}}}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
security:
  - sessionCookie: []
components:
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: lf_session}
  responses:
    Error:
      description: Falha. `correlation_id` repete o cabeçalho X-Request-ID.
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorBody"}}}
  schemas:
    Status:
      type: object
      required: [status]
      properties: {status: {type: string}}
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlation_id]
          properties:
            code: {type: string, description: "Código legível por máquina", example: unauthorized}
            message: {type: string}
            action: {type: string, description: "Ação sugerida"}
            correlation_id: {type: string}
    Session:
      type: object
      required: [id, admin_id, username, expires_at, csrf_token, totp_reset_required]
      properties:
        id: {type: string, format: uuid}
        admin_id: {type: string, format: uuid}
        username: {type: string}
        expires_at: {type: string, format: date-time}
        csrf_token: {type: string, description: "Enviar em X-CSRF-Token nas requisições que alteram estado"}
        reauth_until: {type: string, format: date-time, description: "Ausente = ações sensíveis exigem reautenticação"}
        totp_reset_required: {type: boolean, description: "Entrou com código de recuperação: substitua o 2FA"}
    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: {type: string}
        password: {type: string, format: password}
    CodeRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code: {type: string, example: "123456", description: "Código TOTP de 6 dígitos"}
    RecoveryRequest:
      type: object
      required: [recovery_code]
      additionalProperties: false
      properties:
        recovery_code: {type: string, example: "ABCD-EFGH-IJKL-MNOP"}
    ReauthRequest:
      type: object
      required: [password, code]
      additionalProperties: false
      properties:
        password: {type: string, format: password}
        code: {type: string}
    LoginStage:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [totp_required, totp_enrollment_required]}
    Enrollment:
      type: object
      required: [secret, otpauth_uri]
      properties:
        secret: {type: string, description: "Segredo em base32 para entrada manual"}
        otpauth_uri: {type: string, description: "URI otpauth:// para QR code"}
    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes: {type: array, items: {type: string}, description: "Mostrados uma única vez; uso único"}
    SessionWithRecoveryCodes:
      allOf:
        - $ref: "#/components/schemas/Session"
        - $ref: "#/components/schemas/RecoveryCodes"
    SessionInfo:
      type: object
      required: [id, created_at, expires_at, ip, user_agent, auth_method, current]
      properties:
        id: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        ip: {type: string}
        user_agent: {type: string}
        auth_method: {type: string, enum: [totp, recovery]}
        current: {type: boolean}
    SessionList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/SessionInfo"}}
    RevokedCount:
      type: object
      required: [revoked]
      properties:
        revoked: {type: integer}
    AuthEvent:
      type: object
      required: [id, type, ip, user_agent, detail, created_at]
      properties:
        id: {type: integer}
        type: {type: string, example: login_success}
        ip: {type: string}
        user_agent: {type: string}
        detail: {type: object}
        created_at: {type: string, format: date-time}
    AuthEventList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/AuthEvent"}}
    ConnectionKind:
      type: string
      enum: [github, jira, clickup, cli, api, mcp]
    NewConnection:
      type: object
      required: [kind, name, secret]
      additionalProperties: false
      properties:
        kind: {$ref: "#/components/schemas/ConnectionKind"}
        name: {type: string, minLength: 1, maxLength: 80}
        target: {type: string, maxLength: 200, description: "Destino não secreto (URL do site, organização)"}
        scopes: {type: string, maxLength: 200, description: "Escopos mínimos declarados (documentação)"}
        secret: {type: string, format: password, maxLength: 8192, description: "Somente escrita; nunca devolvido"}
    RotateConnection:
      type: object
      required: [secret, expected_version]
      additionalProperties: false
      properties:
        secret: {type: string, format: password, maxLength: 8192}
        expected_version: {type: integer, minimum: 1}
    Connection:
      type: object
      required: [id, kind, name, target, scopes, state, secret_version, last_test_status, last_test_detail, version, created_at, updated_at]
      description: Nunca inclui o segredo.
      properties:
        id: {type: string, format: uuid, description: "Estável: referência de uso é `connection:<id>`"}
        kind: {$ref: "#/components/schemas/ConnectionKind"}
        name: {type: string}
        target: {type: string}
        scopes: {type: string}
        state: {type: string, enum: [active, revoked]}
        secret_version: {type: integer}
        rotated_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time}
        last_test_at: {type: string, format: date-time}
        last_test_status: {type: string, enum: [ok, failed, not_run]}
        last_test_detail: {type: string}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ConnectionList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Connection"}}
    ProjectState:
      type: string
      enum: [draft, active, paused, archived]
    WizardStep:
      type: string
      enum: [basics, repository, source, review]
    Repository:
      type: object
      required: [owner, name, base_branch, connection_id]
      properties:
        owner: {type: string, description: "Usuário ou organização GitHub; vazio = não preenchido"}
        name: {type: string}
        base_branch: {type: string}
        connection_id: {type: [string, "null"], format: uuid, description: "Referência de conexão GitHub (nunca o segredo)"}
    Source:
      type: object
      required: [kind, connection_id, container, eligibility_marker, eligible_statuses, priority_map, access]
      properties:
        kind: {type: string, enum: ["", jira, clickup]}
        connection_id: {type: [string, "null"], format: uuid}
        container: {type: string, description: "Chave do projeto Jira ou ID da lista ClickUp"}
        eligibility_marker: {type: string, maxLength: 50, description: "Rótulo (Jira) ou tag (ClickUp) que marca o item como elegível"}
        eligible_statuses: {type: array, maxItems: 30, items: {type: string}, description: "Estados da origem dos quais o item pode ser tomado"}
        priority_map:
          type: object
          maxProperties: 20
          additionalProperties: {type: integer, minimum: 0, maximum: 4}
          description: "Prioridade da origem (minúsculas) para a faixa 0..4 da fábrica"
        access: {type: string, enum: [read, read_write]}
    SourceStep:
      type: object
      required: [id, label, status, detail]
      properties:
        id: {type: string, enum: [credential, container, statuses, priorities, items, write]}
        label: {type: string}
        status: {type: string, enum: [ok, failed, skipped]}
        detail: {type: string}
    PreviewItem:
      type: object
      required: [key, title, status, priority, mapped_priority, subtask, url]
      properties:
        key: {type: string}
        title: {type: string}
        status: {type: string}
        priority: {type: string}
        mapped_priority: {type: [integer, "null"], minimum: 0, maximum: 4}
        subtask: {type: boolean}
        url: {type: string}
    SourceCheck:
      type: object
      required: [ok, steps, items, has_more, checked_at]
      properties:
        ok: {type: boolean}
        steps: {type: array, items: {$ref: "#/components/schemas/SourceStep"}}
        items: {type: array, items: {$ref: "#/components/schemas/PreviewItem"}}
        has_more: {type: boolean}
        checked_at: {type: string, format: date-time}
    Project:
      type: object
      required: [id, slug, name, description, state, priority, wizard_step, repository, source, version, activated_at, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        slug: {type: string}
        name: {type: string}
        description: {type: string}
        state: {$ref: "#/components/schemas/ProjectState"}
        priority: {type: integer, minimum: 0, maximum: 4}
        wizard_step: {$ref: "#/components/schemas/WizardStep"}
        repository: {$ref: "#/components/schemas/Repository"}
        source: {$ref: "#/components/schemas/Source"}
        version: {type: integer, minimum: 1}
        activated_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    NewProject:
      type: object
      required: [slug, name]
      additionalProperties: false
      properties:
        slug: {type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", maxLength: 63}
        name: {type: string, minLength: 1, maxLength: 120}
        description: {type: string, maxLength: 500}
        priority: {type: integer, minimum: 0, maximum: 4, description: "Padrão 2"}
    ProjectPatch:
      type: object
      required: [expected_version]
      additionalProperties: false
      properties:
        expected_version: {type: integer, minimum: 1}
        name: {type: string}
        description: {type: string}
        priority: {type: integer, minimum: 0, maximum: 4}
        wizard_step: {$ref: "#/components/schemas/WizardStep"}
        repository: {$ref: "#/components/schemas/Repository"}
        source: {$ref: "#/components/schemas/Source"}
    ExpectedVersion:
      type: object
      required: [expected_version]
      additionalProperties: false
      properties: {expected_version: {type: integer, minimum: 1}}
    ValidationCheck:
      type: object
      required: [id, area, label, status]
      properties:
        id: {type: string, example: "repository.connection"}
        area: {type: string, enum: [basics, repository, source]}
        label: {type: string}
        status: {type: string, enum: [ok, pending]}
        action: {type: string, description: "Ação concreta para resolver a pendência"}
    ValidationReport:
      type: object
      required: [ok, checks, not_verified]
      properties:
        ok: {type: boolean, description: "Verdadeiro só quando todos os itens obrigatórios estão atendidos"}
        checks: {type: array, items: {$ref: "#/components/schemas/ValidationCheck"}}
        not_verified: {type: array, items: {type: string}, description: "O que este relatório ainda não avalia (T05-02, T05-03)"}
    ProjectChange:
      type: object
      required: [id, action, detail, created_at]
      properties:
        id: {type: integer}
        action: {type: string, enum: [created, updated, source_changed, source_checked, activated, suspended, resumed]}
        detail: {type: object, additionalProperties: true, description: "Só nomes de campos e referências; nunca segredos"}
        created_at: {type: string, format: date-time}
    ProjectPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Project"}}
