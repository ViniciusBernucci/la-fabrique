        agent_version: {type: integer}
        provider: {type: string}
        connection_id: {type: [string, "null"], format: uuid}
        model: {type: string}
        instructions: {type: string}
        prompt: {type: string}
        skills: {type: array, items: {type: string}}
        tools: {type: array, items: {type: string}}
        fallback: {type: array, items: {$ref: "#/components/schemas/FallbackStep"}}
        timeout_minutes: {type: integer}
        sources:
          type: object
          description: "Origem de cada valor: agent (base do catálogo) ou node (sobrescrito pelo nó)"
          additionalProperties: {type: string, enum: [agent, node]}
    SkillStep:
      type: object
      required: [type]
      properties:
        type: {type: string, enum: [ai, script, deterministic]}
        command: {type: string}
