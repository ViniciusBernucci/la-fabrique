          properties: {expected_version: {type: integer, minimum: 1}}
    Agent:
      type: object
      required: [id, name, description, instructions, provider, connection_id, model, skills, tools, fallback, timeout_minutes, version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        description: {type: string}
        instructions: {type: string}
        provider: {type: string, enum: [claude, codex, api]}
        connection_id: {type: [string, "null"], format: uuid}
        model: {type: string}
        skills: {type: array, items: {type: string}}
        tools: {type: array, items: {type: string}}
        fallback: {type: array, items: {$ref: "#/components/schemas/FallbackStep"}}
        timeout_minutes: {type: integer}
        version: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    EffectiveAgent:
