        description: {type: string}
        max: {type: integer}
        min: {type: integer}
        options: {type: array, items: {type: string}}
        pattern: {type: string}
    Tool:
      type: object
      required: [name, kind, description, input, output, permissions, limits]
      properties:
        name: {type: string, pattern: "^[a-z][a-z0-9_]{1,47}$"}
        kind: {type: string, enum: [native, script, integration]}
        description: {type: string}
        input: {type: array, items: {$ref: "#/components/schemas/ToolField"}}
        output: {type: array, items: {$ref: "#/components/schemas/ToolField"}}
        permissions: {type: array, items: {type: string, enum: [read, write, exec, git, api]}}
        limits:
          type: object
          required: [timeout_seconds, max_output_bytes]
          properties:
            timeout_seconds: {type: integer, minimum: 1, maximum: 3600}
            max_output_bytes: {type: integer, minimum: 1, maximum: 4194304}
