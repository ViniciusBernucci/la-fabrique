      type: object
      required: [id, label, description]
      properties:
        id: {type: string}
        label: {type: string}
        description: {type: string}
    DecisionEvidence:
      type: object
      required: [label, text]
      properties:
        label: {type: string}
        text: {type: string, description: "Já redigido: sem segredos"}
    DecisionRequest:
      type: object
      required: [id, project_id, execution_id, node_id, kind, title, problem, impact, evidence, options, state, execution_version, resolution_option, resolution_note, resolved_at, version, created_at]
      properties:
        id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        execution_id: {type: string, format: uuid}
        node_id: {type: string}
        kind: {type: string, enum: [conflict, missing_requirement, sensitive_operation, uncertain_result, pr_closed, other]}
        title: {type: string}
        problem: {type: string}
        impact: {type: string}
        evidence: {type: array, items: {$ref: "#/components/schemas/DecisionEvidence"}}
        options: {type: array, minItems: 2, maxItems: 6, items: {$ref: "#/components/schemas/DecisionOption"}}
        state: {type: string, enum: [pending, resolved, stale]}
        execution_version: {type: integer}
        resolution_option: {type: string}
        resolution_note: {type: string}
        resolved_at: {type: [string, "null"], format: date-time}
        version: {type: integer}
        created_at: {type: string, format: date-time}
    PublishProblem:
      type: object
      required: [code, message]
      properties:
        node: {type: string}
        code: {type: string}
        message: {type: string}
    WorkflowVersion:
      type: object
      required: [id, workflow_id, number, draft_version, name, kind, content_hash, published_at]
      properties:
        id: {type: string, format: uuid}
        workflow_id: {type: string, format: uuid}
        number: {type: integer}
        draft_version: {type: integer}
        name: {type: string}
        kind: {type: string, enum: [feature, subflow]}
        description: {type: string}
        graph: {type: object}
        flat_graph: {type: object}
        subflows: {type: object, additionalProperties: {type: string}}
        effective: {type: array, items: {type: object}}
        content_hash: {type: string}
        published_at: {type: string, format: date-time}
        unchanged: {type: boolean}
    Budget:
      type: object
      required: [id, scope, agent_id, period, limit_micros, state, version]
      properties:
        id: {type: string, format: uuid}
        scope: {type: string, enum: [global, agent]}
        agent_id: {type: [string, "null"], format: uuid}
        period: {type: string, enum: [day, month]}
        limit_micros: {type: integer, description: "micro-USD (1e-6)"}
        state: {type: string, enum: [active, disabled]}
        version: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    BudgetStatus:
      allOf:
        - {$ref: "#/components/schemas/Budget"}
        - type: object
          required: [spent_micros, reserved_micros, remaining_micros]
          properties:
            spent_micros: {type: integer}
            reserved_micros: {type: integer}
            remaining_micros: {type: integer}
    UsageReport:
      type: object
      required: [api, subscription]
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        api:
          type: object
          required: [spent_micros, reserved_micros, by_source, by_agent, overrun_micros]
          properties:
            spent_micros: {type: integer}
            reserved_micros: {type: integer}
            overrun_micros: {type: integer}
            by_source: {type: object, additionalProperties: {type: integer}}
            by_agent: {type: object, additionalProperties: {type: integer}}
        subscription:
          type: array
          items:
            type: object
            required: [connection_id, unit, units, calls]
            properties:
              connection_id: {type: string}
              unit: {type: string}
              units: {type: integer}
              calls: {type: integer}
    ModelParams:
      type: object
      properties:
        temperature: {type: number, minimum: 0, maximum: 2}
        top_p: {type: number, minimum: 0, maximum: 1}
        max_tokens: {type: integer, minimum: 1}
    ModelInput:
      type: object
      required: [provider, name]
      additionalProperties: false
      properties:
        provider: {type: string, enum: [claude, codex, api]}
        gateway: {type: string, enum: ["", openrouter, vercel]}
        name: {type: string}
        label: {type: string}
        supports_tools: {type: boolean}
        supports_streaming: {type: boolean}
        context_window: {type: integer, minimum: 0}
        max_output_tokens: {type: integer, minimum: 0}
        params: {$ref: "#/components/schemas/ModelParams"}
        input_micros_per_mtok: {type: [integer, "null"], minimum: 0, description: "Preço de entrada em micro-USD por milhão de tokens (com output e a fonte)"}
        output_micros_per_mtok: {type: [integer, "null"], minimum: 0}
        price_source: {type: string}
    Model:
      type: object
      required: [id, provider, gateway, name, supports_tools, supports_streaming, context_window, max_output_tokens, params, state, version]
      properties:
        id: {type: string, format: uuid}
        provider: {type: string}
        gateway: {type: string}
        name: {type: string}
        label: {type: string}
        supports_tools: {type: boolean}
        supports_streaming: {type: boolean}
        context_window: {type: integer}
        max_output_tokens: {type: integer}
        params: {$ref: "#/components/schemas/ModelParams"}
        input_micros_per_mtok: {type: [integer, "null"]}
        output_micros_per_mtok: {type: [integer, "null"]}
        price_source: {type: string}
        state: {type: string, enum: [active, disabled]}
        version: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ModelVerdict:
      type: object
      required: [ok, problems]
      properties:
        ok: {type: boolean}
        model: {$ref: "#/components/schemas/Model"}
        problems: {type: array, items: {type: string}}
    McpServer:
      type: object
      required: [id, name, url, connection_id, protocol, server_name, server_version, discovered_at, created_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        url: {type: string}
        connection_id: {type: [string, "null"], format: uuid}
        protocol: {type: string}
        server_name: {type: string}
        server_version: {type: string}
        discovered_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
    McpTool:
      type: object
      required: [server_id, name, description, input_schema, schema_hash, status]
      properties:
        server_id: {type: string, format: uuid}
        name: {type: string}
        description: {type: string, description: "Dado do servidor (não confiável)"}
        input_schema: {type: object, additionalProperties: true}
        schema_hash: {type: string}
        status: {type: string, enum: [active, removed]}
    McpGrant:
      type: object
      required: [agent_id, server_id, tool, schema_hash, current]
      properties:
        agent_id: {type: string, format: uuid}
        server_id: {type: string, format: uuid}
        tool: {type: string}
        schema_hash: {type: string}
        current: {type: boolean, description: "O hash aprovado ainda é o do esquema vigente"}
    McpGrantInput:
      type: object
      required: [server_id, tool, schema_hash]
      additionalProperties: false
      properties:
        server_id: {type: string, format: uuid}
        tool: {type: string}
        schema_hash: {type: string}
