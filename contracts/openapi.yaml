        code: {type: string}
        message: {type: string}
    Workflow:
      type: object
      required: [id, name, kind, description, graph, version, issues, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        kind: {type: string, enum: [feature, subflow]}
        description: {type: string}
        graph: {$ref: "#/components/schemas/WorkflowGraph"}
        version: {type: integer, minimum: 1}
        issues: {type: array, items: {$ref: "#/components/schemas/WorkflowIssue"}}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    WorkflowSummary:
      type: object
      required: [id, name, kind, description, version, nodes, issues, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        kind: {type: string, enum: [feature, subflow]}
        description: {type: string}
        version: {type: integer}
        nodes: {type: integer}
        issues: {type: integer}
        updated_at: {type: string, format: date-time}
    NewWorkflow:
      type: object
      required: [name, kind]
